<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Libraries -->
    <script type="module">
        // IMPORTANT: PASTE YOUR FIREBASE CONFIG OBJECT HERE
        const firebaseConfig = {
        apiKey: "AIzaSyASJe1f1-kM0Res8Di18Eu5HrlfvjB2oZo",
        authDomain: "homemanager-4e00f.firebaseapp.com",
        projectId: "homemanager-4e00f",
        storageBucket: "homemanager-4e00f.firebasestorage.app",
        messagingSenderId: "476624861696",
        appId: "1:476624861696:web:65ea2ac4e80de5f9f976e5"
        };
        window.firebaseConfig = firebaseConfig;
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .calendar-day { aspect-ratio: 1 / 1; transition: all 0.2s ease-in-out; }
        .calendar-day:hover { transform: scale(1.05); }
        .modal { transition: opacity 0.3s ease; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -appearance: textfield; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="app-container" class="max-w-lg mx-auto p-4 min-h-screen bg-white shadow-md">

        <!-- Login Page -->
        <div id="login-page">
            <h1 class="text-3xl font-bold text-gray-900 text-center mb-8">Home Hub Login</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <p id="login-error" class="text-sm text-red-600 hidden"></p>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:bg-blue-700">Sign In</button>
            </form>
        </div>

        <!-- Main App Content (Initially Hidden) -->
        <div id="main-app" class="hidden">
            <header class="flex items-center justify-between mb-6 pb-4 border-b">
                <h1 id="page-title" class="text-3xl font-bold text-gray-900">Home Hub</h1>
                <div>
                    <button id="back-to-home" class="hidden text-blue-600 hover:text-blue-800 font-medium mr-4">&larr; Home</button>
                    <button id="sign-out-btn" class="text-sm text-red-500 hover:text-red-700 font-medium">Sign Out</button>
                </div>
            </header>

            <main id="home-page">
                <div id="bill-reminder" class="hidden p-4 mb-4 bg-indigo-100 border-l-4 border-indigo-500 text-indigo-800 rounded-lg shadow">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-lg">End of Month Bills</h4>
                            <p class="text-sm">Time to pay the bills for this month!</p>
                            <div class="mt-2 text-sm space-y-2">
                                <p><strong>Maid:</strong> <span class="font-normal">Pay monthly salary</span></p>
                                <div>
                                    <p><strong>Milk/Curd Total:</strong> <span id="reminder-milk-total" class="font-semibold">₹0.00</span></p>
                                    <p class="text-xs text-indigo-600 pl-2">(<span id="reminder-milk-count">0</span> milk, <span id="reminder-curd-count">0</span> curd)</p>
                                </div>
                            </div>
                        </div>
                        <button id="close-reminder" class="text-indigo-500 hover:text-indigo-700 text-2xl leading-none">&times;</button>
                    </div>
                </div>
                <h2 class="text-xl font-semibold mb-4 text-gray-700">What would you like to manage?</h2>
                <div class="grid grid-cols-1 gap-4">
                    <button data-page="maid-tracker" class="page-btn w-full bg-blue-600 text-white font-bold py-4 px-4 rounded-lg shadow-md hover:bg-blue-700">Maid Tracker</button>
                    <button data-page="milk-tracker" class="page-btn w-full bg-green-600 text-white font-bold py-4 px-4 rounded-lg shadow-md hover:bg-green-700">Milk Tracker</button>
                    <button class="w-full bg-gray-400 text-white font-bold py-4 px-4 rounded-lg cursor-not-allowed">Expense Tracker (Coming Soon)</button>
                </div>
            </main>

            <div id="maid-tracker-page" class="page hidden"></div>
            <div id="milk-tracker-page" class="page hidden"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="maid-status-modal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden pointer-events-none opacity-0"></div>
    <div id="milk-status-modal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden pointer-events-none opacity-0"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";

        const app = initializeApp(window.firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM ELEMENTS ---
            const loginPage = document.getElementById('login-page');
            const mainApp = document.getElementById('main-app');
            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');
            const signOutBtn = document.getElementById('sign-out-btn');
            
            // --- GLOBAL STATE ---
            let maidData = {}, milkData = {}, settingsData = { milkCost: 30, curdCost: 25, milkDefault: 1 };
            let currentDate = new Date(), selectedDayElement = null, activeTracker = null;
            let unsubMaid, unsubMilk, unsubSettings; // To hold our listener functions

            // --- AUTHENTICATION LOGIC ---
            onAuthStateChanged(auth, user => {
                if (user) {
                    // User is signed in
                    loginPage.classList.add('hidden');
                    mainApp.classList.remove('hidden');
                    initializeAppLogic();
                } else {
                    // User is signed out
                    mainApp.classList.add('hidden');
                    loginPage.classList.remove('hidden');
                    // Stop listening to data when logged out to save resources
                    if (unsubMaid) unsubMaid();
                    if (unsubMilk) unsubMilk();
                    if (unsubSettings) unsubSettings();
                }
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    loginError.classList.add('hidden');
                } catch (error) {
                    loginError.textContent = "Error: Invalid email or password.";
                    loginError.classList.remove('hidden');
                    console.error("Login failed:", error);
                }
            });

            signOutBtn.addEventListener('click', () => {
                signOut(auth);
            });

            // --- MAIN APP LOGIC (runs only after login) ---
            function initializeAppLogic() {
                const pageTitle = document.getElementById('page-title');
                const homePage = document.getElementById('home-page');
                const backToHomeBtn = document.getElementById('back-to-home');

                // --- DATA LISTENERS ---
                unsubMaid = onSnapshot(doc(db, "trackers", "maid"), (doc) => {
                    maidData = doc.exists() ? doc.data() : {};
                    if (activeTracker === 'maid') renderCalendar();
                });
                unsubMilk = onSnapshot(doc(db, "trackers", "milk"), (doc) => {
                    milkData = doc.exists() ? doc.data() : {};
                    if (activeTracker === 'milk') renderCalendar();
                });
                unsubSettings = onSnapshot(doc(db, "trackers", "settings"), (doc) => {
                    if (doc.exists()) {
                        settingsData = { ...settingsData, ...doc.data() };
                        if (activeTracker) renderCalendar();
                    }
                });

                // --- TEMPLATES (same as before) ---
                const createTrackerPageHTML = (trackerType) => {
                    const isMaid = trackerType === 'maid';
                    return `
                        <div class="flex items-center justify-between mb-4">
                            <button class="prev-month p-2 rounded-full hover:bg-gray-200">&lt;</button>
                            <h2 class="month-year text-xl font-bold"></h2>
                            <button class="next-month p-2 rounded-full hover:bg-gray-200">&gt;</button>
                        </div>
                        <div class="calendar-grid text-center font-medium text-sm text-gray-500 mb-2">
                            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                        </div>
                        <div class="calendar calendar-grid"></div>
                        ${isMaid ? createMaidSummaryHTML() : createMilkSettingsAndSummaryHTML()}
                    `;
                };
                const createMaidSummaryHTML = () => `
                    <div class="summary mt-8 pt-6 border-t">
                         <h3 class="text-lg font-semibold mb-3 text-gray-800">Monthly Summary</h3>
                         <div class="space-y-2">
                            <div class="flex justify-between items-center p-3 bg-green-100 rounded-lg"><span class="font-medium text-green-800">Cleaned Days</span><span class="cleaned-count font-bold text-lg text-green-900">0</span></div>
                            <div class="flex justify-between items-center p-3 bg-red-100 rounded-lg"><span class="font-medium text-red-800">Absent Days</span><span class="absent-count font-bold text-lg text-red-900">0</span></div>
                         </div>
                    </div>`;
                const createMilkSettingsAndSummaryHTML = () => `
                    <div class="mt-8 pt-6 border-t">
                        <h3 class="text-lg font-semibold mb-3 text-gray-800">Settings</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label for="milk-cost" class="block text-sm font-medium text-gray-700">Cost per Milk Packet</label><input type="number" id="milk-cost" value="${settingsData.milkCost}" class="setting-input mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm"></div>
                            <div><label for="curd-cost" class="block text-sm font-medium text-gray-700">Cost per Curd Unit</label><input type="number" id="curd-cost" value="${settingsData.curdCost}" class="setting-input mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm"></div>
                        </div>
                        <div class="mt-4"><label for="milk-default-packets" class="block text-sm font-medium text-gray-700">Default Milk Packets</label><input type="number" id="milk-default-packets" value="${settingsData.milkDefault}" class="setting-input mt-1 block w-full max-w-xs px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm"></div>
                    </div>
                    <div class="summary mt-6 pt-6 border-t">
                         <h3 class="text-lg font-semibold mb-3 text-gray-800">Monthly Expense Summary</h3>
                         <div class="space-y-2">
                            <div class="p-3 bg-blue-100 rounded-lg"><div class="flex justify-between items-center"><span class="font-medium text-blue-800">Milk Packets</span><span class="milk-count font-bold text-lg text-blue-900">0</span></div><div class="flex justify-between items-center text-sm mt-1"><span class="text-blue-700">Total Milk Cost</span><span class="milk-total-cost font-medium text-blue-800">₹0.00</span></div></div>
                            <div class="p-3 bg-yellow-100 rounded-lg"><div class="flex justify-between items-center"><span class="font-medium text-yellow-800">Curd Units</span><span class="curd-count font-bold text-lg text-yellow-900">0</span></div><div class="flex justify-between items-center text-sm mt-1"><span class="text-yellow-700">Total Curd Cost</span><span class="curd-total-cost font-medium text-yellow-800">₹0.00</span></div></div>
                            <div class="flex justify-between items-center p-4 bg-gray-800 text-white rounded-lg mt-4"><span class="font-bold text-lg">Grand Total</span><span class="grand-total font-bold text-xl">₹0.00</span></div>
                         </div>
                    </div>`;
                const createMaidModalHTML = () => `<div class="modal-content bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm"><h3 class="text-xl font-bold text-center mb-6">Update Status for <span class="modal-date"></span></h3><div class="grid grid-cols-1 gap-3"><button data-status="cleaned" class="status-btn w-full bg-green-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-600">Cleaned</button><button data-status="absent" class="status-btn w-full bg-red-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-red-600">Absent</button><button data-status="none" class="status-btn w-full bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-300 mt-4">Clear Status</button></div></div>`;
                const createMilkModalHTML = () => `<div class="modal-content bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm"><h3 class="text-xl font-bold text-center mb-6">Update Delivery for <span class="modal-date"></span></h3><div class="space-y-4"><div><label for="milk-packets" class="block text-sm font-medium text-gray-700">Milk Packets</label><input type="number" id="milk-packets" min="0" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm"></div><div><label for="curd-units" class="block text-sm font-medium text-gray-700">Curd Units</label><input type="number" id="curd-units" min="0" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm"></div></div><div class="mt-6 grid grid-cols-2 gap-3"><button id="clear-milk-entry" class="w-full bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded-lg hover:bg-gray-300">Clear</button><button id="save-milk-entry" class="w-full bg-green-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-600">Save</button></div></div>`;

                // --- NAVIGATION ---
                const showPage = (pageId) => {
                    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
                    homePage.classList.add('hidden');
                    const pageToShow = document.getElementById(pageId);
                    if (pageToShow) {
                        activeTracker = pageId.split('-')[0];
                        pageToShow.innerHTML = createTrackerPageHTML(activeTracker);
                        document.getElementById(`${activeTracker}-status-modal`).innerHTML = activeTracker === 'maid' ? createMaidModalHTML() : createMilkModalHTML();
                        pageToShow.classList.remove('hidden');
                        backToHomeBtn.classList.remove('hidden');
                        pageTitle.textContent = `${activeTracker.charAt(0).toUpperCase() + activeTracker.slice(1)} Tracker`;
                        currentDate = new Date();
                        renderCalendar();
                        addPageEventListeners(pageToShow);
                    }
                };
                const showHomePage = () => {
                    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
                    homePage.classList.remove('hidden');
                    backToHomeBtn.classList.add('hidden');
                    pageTitle.textContent = "Home Hub";
                    activeTracker = null;
                    checkBillReminders();
                };
                document.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', () => showPage(btn.dataset.page + '-page')));
                backToHomeBtn.addEventListener('click', showHomePage);

                // --- CALENDAR LOGIC (same as before) ---
                const renderCalendar = () => {
                    if (!activeTracker) return;
                    const page = document.getElementById(`${activeTracker}-tracker-page`);
                    const calendarEl = page.querySelector('.calendar');
                    const monthYearEl = page.querySelector('.month-year');
                    calendarEl.innerHTML = '';
                    const year = currentDate.getFullYear();
                    const month = currentDate.getMonth();
                    const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
                    const data = activeTracker === 'maid' ? maidData : milkData;
                    const monthData = data[monthKey] || {};
                    monthYearEl.textContent = `${currentDate.toLocaleString('default', { month: 'long' })} ${year}`;
                    const firstDayOfMonth = new Date(year, month, 1).getDay();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    for (let i = 0; i < firstDayOfMonth; i++) calendarEl.innerHTML += `<div class="bg-gray-50 rounded-lg"></div>`;
                    for (let day = 1; day <= daysInMonth; day++) {
                        const dayEl = document.createElement('div');
                        dayEl.className = 'calendar-day flex items-center justify-center font-semibold border-2 rounded-lg cursor-pointer';
                        dayEl.textContent = day;
                        dayEl.dataset.day = day;
                        const today = new Date();
                        if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) dayEl.classList.add('border-blue-500', 'text-blue-600');
                        else dayEl.classList.add('border-gray-200');
                        updateDayElement(dayEl, monthData[day]);
                        dayEl.addEventListener('click', () => {
                            selectedDayElement = dayEl;
                            openStatusModal(day);
                        });
                        calendarEl.appendChild(dayEl);
                    }
                    updateSummary(monthData);
                };
                const updateDayElement = (element, status) => {
                    element.classList.remove('bg-green-500', 'bg-red-500', 'text-white', 'bg-blue-500');
                    if (activeTracker === 'maid') {
                        if (status === 'cleaned') element.classList.add('bg-green-500', 'text-white');
                        else if (status === 'absent') element.classList.add('bg-red-500', 'text-white');
                    } else if (activeTracker === 'milk') {
                        if (status && (status.milk > 0 || status.curd > 0)) element.classList.add('bg-blue-500', 'text-white');
                    }
                };

                // --- EVENT LISTENERS ---
                function addPageEventListeners(page) {
                    page.querySelector('.prev-month').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
                    page.querySelector('.next-month').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
                    if (activeTracker === 'milk') {
                        page.querySelectorAll('.setting-input').forEach(input => {
                            input.addEventListener('change', async () => {
                                const newSettings = {
                                    milkCost: parseFloat(page.querySelector('#milk-cost').value) || 0,
                                    curdCost: parseFloat(page.querySelector('#curd-cost').value) || 0,
                                    milkDefault: parseInt(page.querySelector('#milk-default-packets').value) || 0
                                };
                                await setDoc(doc(db, "trackers", "settings"), newSettings, { merge: true });
                            });
                        });
                    }
                }
                const openStatusModal = (day) => {
                    const modal = document.getElementById(`${activeTracker}-status-modal`);
                    modal.querySelector('.modal-date').textContent = `${day} ${currentDate.toLocaleString('default', { month: 'long' })}`;
                    if (activeTracker === 'milk') {
                        const monthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
                        const dayData = milkData[monthKey]?.[day];
                        const milkInput = modal.querySelector('#milk-packets');
                        const curdInput = modal.querySelector('#curd-units');
                        if (dayData) {
                            milkInput.value = dayData.milk || 0;
                            curdInput.value = dayData.curd || 0;
                        } else {
                            milkInput.value = settingsData.milkDefault || 0;
                            curdInput.value = 0;
                        }
                    }
                    modal.classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                    setTimeout(() => { modal.classList.remove('pointer-events-none', 'opacity-0'); modal.querySelector('.modal-content').classList.remove('scale-95'); }, 10);
                };
                const closeStatusModal = (modal) => {
                    modal.classList.add('opacity-0');
                    modal.querySelector('.modal-content').classList.add('scale-95');
                    document.body.style.overflow = 'auto';
                    setTimeout(() => { modal.classList.add('hidden', 'pointer-events-none'); }, 300);
                };
                document.getElementById('app-container').addEventListener('click', async (e) => {
                    const modal = e.target.closest('.modal');
                    if (modal && e.target === modal) { closeStatusModal(modal); return; }
                    if (e.target.matches('#maid-status-modal .status-btn')) {
                        const status = e.target.dataset.status;
                        const day = selectedDayElement.dataset.day;
                        const monthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
                        maidData[monthKey] = maidData[monthKey] || {};
                        if (status === 'none') delete maidData[monthKey][day];
                        else maidData[monthKey][day] = status;
                        await setDoc(doc(db, "trackers", "maid"), maidData);
                        closeStatusModal(e.target.closest('.modal'));
                    }
                    if (e.target.matches('#save-milk-entry, #clear-milk-entry')) {
                        const day = selectedDayElement.dataset.day;
                        const monthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
                        milkData[monthKey] = milkData[monthKey] || {};
                        if (e.target.id === 'clear-milk-entry') delete milkData[monthKey][day];
                        else {
                            const milkQty = parseInt(document.getElementById('milk-packets').value) || 0;
                            const curdQty = parseInt(document.getElementById('curd-units').value) || 0;
                            if (milkQty > 0 || curdQty > 0) milkData[monthKey][day] = { milk: milkQty, curd: curdQty };
                            else delete milkData[monthKey][day];
                        }
                        await setDoc(doc(db, "trackers", "milk"), milkData);
                        closeStatusModal(e.target.closest('.modal'));
                    }
                });
                
                // --- SUMMARY & BILLS (same as before) ---
                const updateSummary = (monthData) => {
                     const page = document.getElementById(`${activeTracker}-tracker-page`);
                     if (!page || !page.querySelector('.summary')) return;
                     if (activeTracker === 'maid') {
                        const cleaned = Object.values(monthData || {}).filter(s => s === 'cleaned').length;
                        const absent = Object.values(monthData || {}).filter(s => s === 'absent').length;
                        page.querySelector('.cleaned-count').textContent = cleaned;
                        page.querySelector('.absent-count').textContent = absent;
                     } else if (activeTracker === 'milk') {
                        const totals = calculateMilkTotals(monthData);
                        page.querySelector('.milk-count').textContent = totals.totalMilk;
                        page.querySelector('.curd-count').textContent = totals.totalCurd;
                        page.querySelector('.milk-total-cost').textContent = `₹${totals.totalMilkCost.toFixed(2)}`;
                        page.querySelector('.curd-total-cost').textContent = `₹${totals.totalCurdCost.toFixed(2)}`;
                        page.querySelector('.grand-total').textContent = `₹${totals.grandTotal.toFixed(2)}`;
                     }
                };
                const calculateMilkTotals = (monthData) => {
                    let totalMilk = 0, totalCurd = 0;
                    for (const day in monthData) {
                        totalMilk += monthData[day]?.milk || 0;
                        totalCurd += monthData[day]?.curd || 0;
                    }
                    const totalMilkCost = totalMilk * settingsData.milkCost;
                    const totalCurdCost = totalCurd * settingsData.curdCost;
                    const grandTotal = totalMilkCost + totalCurdCost;
                    return { totalMilk, totalCurd, totalMilkCost, totalCurdCost, grandTotal };
                };
                const checkBillReminders = () => {
                    const billReminder = document.getElementById('bill-reminder');
                    const reminderMilkTotal = document.getElementById('reminder-milk-total');
                    const reminderMilkCount = document.getElementById('reminder-milk-count');
                    const reminderCurdCount = document.getElementById('reminder-curd-count');
                    const today = new Date();
                    const dayOfMonth = today.getDate();
                    const year = today.getFullYear();
                    const month = today.getMonth();
                    const daysInCurrentMonth = new Date(year, month + 1, 0).getDate();
                    if (dayOfMonth >= daysInCurrentMonth - 2) {
                        const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
                        const currentMonthMilkData = milkData[monthKey] || {};
                        const milkTotals = calculateMilkTotals(currentMonthMilkData);
                        reminderMilkTotal.textContent = `₹${milkTotals.grandTotal.toFixed(2)}`;
                        reminderMilkCount.textContent = milkTotals.totalMilk;
                        reminderCurdCount.textContent = milkTotals.totalCurd;
                        billReminder.classList.remove('hidden');
                    } else {
                        billReminder.classList.add('hidden');
                    }
                };
                document.getElementById('close-reminder').addEventListener('click', () => document.getElementById('bill-reminder').classList.add('hidden'));

                // --- INITIALIZATION ---
                showHomePage();
            }
        });
    </script>
</body>
</html>
